<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endervision Fan Voting</title>
    <meta name="description" content="Vote pour les artistes préférés de la communauté Endervision." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar container">
        <div class="brand" aria-label="Endervision Fan Voting">
          <span style="font-family: 'Didot', 'Bodoni MT', serif; font-style: italic; color: #00ff00;">
  ENDERVIS<span style="display: inline-block; font-size: 1.2em;">❤️🇩🇪</span>N
</span> FAN VOTING
<span>ENDERVISION</span> FAN VOTING
        </div>
        <a class="admin-button" href="admin.html">Admin</a>
      </header>

      <main class="container">
        <section class="hero">
          <p class="eyebrow">Fan Awards 2026</p>
          <h1>
            VOTE FOR YOUR<br />
            <span class="gradient-text">FAVORITE ARTIST</span>
          </h1>
          <p class="subtitle">
            Choisissez votre artiste préféré et donnez entre 1 et 3 points.
          </p>
        </section>

        <section id="artist-grid" class="artist-grid" aria-live="polite"></section>
      </main>
    </div>

    <div id="vote-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" aria-label="Fermer">×</button>
        <p class="modal-kicker">Donner des points</p>
        <h2 id="modal-title">Artiste</h2>

        <div class="vote-controls" aria-label="Choisir le score">
          <button class="score-button minus" type="button" aria-label="Retirer un point">−</button>
          <div class="score-value" id="score-value">1</div>
          <button class="score-button plus" type="button" aria-label="Ajouter un point">+</button>
        </div>

        <div class="score-rules">
          <p>Minimum : 1</p>
          <p>Maximum : 3</p>
        </div>

        <button id="submit-vote" class="submit-vote" type="button">Valider mon vote</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
